<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✳️💜🥷🏻Unprincipled Inc. Web3 OS🥷🏻💜✳️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            position: relative;
        }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.4em;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #fff, #aaa, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.6);
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        
        .teaser {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.25rem;
            margin: 1.2rem 0;
            min-height: 90px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 300% 300%;
            animation: rainbow 6s linear infinite;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .reveal {
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin: 2.5rem 0 2rem;
            color: #fff;
            text-shadow: 0 0 40px #fff,
                         0 0 80px #ff00ff;
            opacity: 0;
            animation: pulse 4s infinite alternate;
        }
        
        .blurred-art {
            width: 340px;
            height: 340px;
            background: #111;
            border: 3px solid #fff;
            box-shadow: 0 0 60px rgba(255,255,255,0.4),
                        inset 0 0 60px rgba(255,255,255,0.1);
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            transition: all 0.8s ease;
        }
        
        .blurred-art::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.08) 10px,
                rgba(255,255,255,0.08) 20px
            );
            animation: scan 3s linear infinite;
            opacity: 0.4;
        }
        
        .blurred-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(18px) contrast(0.85) brightness(0.7);
            transition: filter 1.2s ease;
        }
        
        .active .blurred-art img {
            filter: blur(6px) contrast(1.1) brightness(1.3);
        }
        
        .scanline {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(transparent, rgba(255,255,255,0.9), transparent);
            box-shadow: 0 0 20px #fff;
            animation: scanline-anim 5s linear infinite;
            opacity: 0.25;
        }
        
        .signal-button {
            margin-top: 2rem;
            padding: 18px 48px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            background: transparent;
            color: #fff;
            border: 3px solid #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
        
        .signal-button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 50px #fff;
            transform: scale(1.05);
        }
        
        .signal-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.4),
                transparent
            );
            transition: 0.7s;
        }
        
        .signal-button:hover::before {
            left: 300%;
        }
        
        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            letter-spacing: 4px;
            opacity: 0.5;
            color: #aaa;
        }
        
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        
        @keyframes pulse {
            from { text-shadow: 0 0 30px #fff; }
            to { text-shadow: 0 0 70px #ff00ff, 0 0 100px #00ffff; }
        }
        
        @keyframes scan { 0% { transform: translateX(-150%); } 100% { transform: translateX(250%); } }
        @keyframes scanline-anim { 0% { top: -150%; } 100% { top: 350%; } }
    </style>
</head>
<body>
    <canvas id="space"></canvas>
    
    <div class="content">
        <!-- Swapped: SOMETHING IS COMING… is now at the top -->
        <div class="reveal" id="reveal">SOMETHING IS COMING…</div>
        
        <div class="blurred-art" id="artContainer">
            <div class="scanline"></div>
            <img id="art1" src="https://picsum.photos/id/1015/800/800" alt="Lords & Ladies">
            <img id="art2" src="https://picsum.photos/id/102/800/800" alt="Nobles" style="display:none;">
            <img id="art3" src="https://picsum.photos/id/1036/800/800" alt="Peasants" style="display:none;">
        </div>
        
        <div class="teaser" id="teaser">333 LORDS AND LADIES</div>
        <div class="logo">UNPRINCIPLED INC.</div>
        <button class="signal-button" onclick="handleSignal()">
            SUPPORT WEB3 NOW
        </button>
        
        <div class="footer">SOLANA • 2026 • TRANSMISSION INCOMING</div>
    </div>

    <script>
        // Three.js Starfield
        let scene, camera, renderer, particles;
        
        function initSpace() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('space'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            
            for (let i = 0; i < 9000; i++) {
                const x = Math.random() * 2000 - 1000;
                const y = Math.random() * 2000 - 1000;
                const z = Math.random() * 1800 - 900;
                vertices.push(x, y, z);
                
                const intensity = Math.random();
                colors.push(intensity, intensity, intensity);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            camera.position.z = 5;
        }
        
        function animateSpace() {
            requestAnimationFrame(animateSpace);
            
            particles.rotation.y += 0.00008;
            const pos = particles.geometry.attributes.position.array;
            for (let i = 2; i < pos.length; i += 3) {
                pos[i] += 4.5;
                if (pos[i] > 900) pos[i] = -900;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Teaser cycling
        const teasers = [
            { text: "333 LORDS AND LADIES", imgId: "art1" },
            { text: "666 NOBLES", imgId: "art2" },
            { text: "999 PEASANTS", imgId: "art3" }
        ];
        let current = 0;
        const teaserEl = document.getElementById('teaser');
        const artContainer = document.getElementById('artContainer');
        
        function cycleTeaser() {
            current = (current + 1) % teasers.length;
            
            teaserEl.style.opacity = 0;
            artContainer.classList.remove('active');
            
            setTimeout(() => {
                teaserEl.textContent = teasers[current].text;
                
                document.querySelectorAll('#artContainer img').forEach(img => {
                    img.style.display = 'none';
                });
                const newImg = document.getElementById(teasers[current].imgId);
                newImg.style.display = 'block';
                
                teaserEl.style.opacity = 1;
                artContainer.classList.add('active');
            }, 650);
        }
        
        // Simple, clean public signal
        function handleSignal() {
            const tweetText = encodeURIComponent(
                "Locking in with @UnprincipledInc… LFG 🔥🚀🔥\n\n" +
                "#TheResistance"
            );
            
            window.open(`https://x.com/intent/tweet?text=${tweetText}`, '_blank');
        }
        
        // Init everything
        window.onload = () => {
            initSpace();
            animateSpace();
            
            // Staggered entrance - adjusted timing for new order
            setTimeout(() => document.getElementById('reveal').style.opacity = 1, 400);
            setTimeout(() => document.querySelector('.logo').style.opacity = 1, 900);
            
            setTimeout(() => {
                artContainer.classList.add('active');
                teaserEl.style.opacity = 1;
            }, 1600);
            
            // Cycle every 5.2s
            setInterval(cycleTeaser, 5200);
            
            // Subtle reveal pulse glitch
            setInterval(() => {
                const reveal = document.getElementById('reveal');
                reveal.style.transform = 'scale(1.03)';
                setTimeout(() => reveal.style.transform = 'scale(1)', 220);
            }, 6800);
        };
    </script>
</body>
</html>
